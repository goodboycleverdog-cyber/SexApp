<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/0.0.0-359252c/tailwind.min.css">

    <!-- Css added -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
    <!-- JS -->
    <script src="./scripts/pick.js"></script>
    <title>SexPick</title>
</head>

<body class="bg-black text-yellow-100 text-center">
    <h1 class="my-2">Sex Pick</h1>
    <!-- Pick zone -->
    <aside id="buttons" class="md:flex lg:max-w-7xl lg:mx-auto">
        <button id="preliminary" type="button" class="font-bold text-3xl w-96 my-3 border border-4 rounded-full p-3 mx-auto text-center block" onclick="pick()"> <a
                href="#result">Préliminaires classiques</a></button>
        <button id="hotPreliminary" type="button" class="font-bold text-3xl w-96 my-3 border border-4 rounded-full p-3 mx-auto text-center block" onclick="hotPick()"><a
                href="#result">Préliminaires avancés</a></button>
        <button id="position" type="button" class="font-bold text-3xl w-96 my-3 border border-4 rounded-full p-3 mx-auto text-center block" onclick="sexualPosition()">La
                suite...</button>

    </aside>
    <!-- Timer zone -->

    <aside id="timer-zone" class="my-3">
        <div id="timer" class="text-7xl my-5">0:00</div>
    </aside>

    <!-- result zone -->
    <div id="result" class="text-7xl"></div>

    <!-- Sound zone -->
    <audio id="audio" src="./scr/son.mp3">Son de fin du timer</audio>

</body>

</html>
