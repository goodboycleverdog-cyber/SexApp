<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/0.0.0-359252c/tailwind.min.css">

    <!-- Css added -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
    <!-- JS -->
    <script src="./scripts/pick.js"></script>
    <title>SexPick</title>
</head>

<body>
    <h1 class="display-1 text-center mb-5">Sex Pick</h1>
    <!-- Pick zone -->
    <aside id="buttons" class="text-center">
        <button id="preliminary" type="button" class="btn btn-dark btn-lg mx-5" onclick="pick()"> <a
                href="#result">Préliminaires classiques</a></button>
        <button id="hotPreliminary" type="button" class="btn btn-dark btn-lg mx-5" onclick="hotPick()"><a
                href="#result">Préliminaires avancés</a></button>
        <button id="position" type="button" class="btn btn-dark btn-lg mx-5" onclick="sexualPosition()"><a href="">La
                suite...</a></button>


        <div class="relative pt-1 w-75 mx-auto">
            <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-pink-200">
                <div style="width:30%"
                    class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-pink-500">
                </div>
            </div>
        </div>

    </aside>
    <!-- Timer zone -->

    <aside id="timer-zone" class="text-center my-5">
        <div id="timer" class="display-2">0:00</div>
    </aside>

    <!-- result zone -->
    <div id="result" class="display-3 text-center"></div>

    <!-- Sound zone -->
    <audio id="audio" src="./scr/son.mp3">Son de fin du timer</audio>

</body>

</html>
