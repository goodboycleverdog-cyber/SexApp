<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sex Pick</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="./scripts/data.js"></script>
  <script src="./scripts/pick.js"></script>
</head>

<body>

<main class="app">

  <section class="main-panel">

    <h1>Sex Pick</h1>

    <!-- TIMER -->
    <div class="timer-card">
      <div class="timer-topline">
        <span id="statusBadge">Prêt</span>
        <span id="currentCategory">Aucune sélection</span>
      </div>

      <div id="timer">2:00</div>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="result" class="result-card">
      Le résultat apparaîtra ici
    </div>

    <!-- ACTIONS -->
    <div class="feedback-actions">
      <button id="passButton">Passer</button>
      <button id="nextPhaseButton">Étape suivante</button>
    </div>

    <!-- PHASE BUTTONS -->
    <div class="choice-grid">
      <button data-category="classic">Classique</button>
      <button data-category="advanced">Avancé</button>
      <button data-category="toy">Accessoires</button>
      <button data-category="position">Position</button>
    </div>

  </section>

  <!-- SIDE -->
  <aside class="side-panel">

    <div class="panel-card">

      <h2>Filtres</h2>

      <label>
        Doux uniquement
        <input id="softOnly" type="checkbox">
      </label>

      <label>
        Inclure accessoires
        <input id="includeToys" type="checkbox" checked>
      </label>

      <label>
        Position
        <select id="positionSelect"></select>
      </label>

      <input id="timerDuration" type="range" min="30" max="300" step="30" value="120">
      <div id="timerDurationLabel">2:00</div>

    </div>

    <div class="panel-card">
      <h2>Historique</h2>
      <button id="clearHistory">Effacer</button>
      <div id="historyList"></div>
    </div>

  </aside>

</main>

<!-- MODAL -->
<div id="confirmModal" hidden>
  <div id="modalBackdrop"></div>
  <div class="modal-card">
    <h2>Changer d’étape ?</h2>
    <p>Passer à <span id="modalCategory"></span> ?</p>
    <button id="cancelChange">Annuler</button>
    <button id="confirmChange">Confirmer</button>
  </div>
</div>

<!-- COOKIE -->
<div id="cookieBanner">
  <p>Sauvegarde locale</p>
  <button id="acceptCookies">OK</button>
</div>

</body>
</html>
